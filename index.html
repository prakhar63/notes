<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes</title>
  <meta name="theme-color" content="#EAE6DE">
  <meta name="description" content="A notebook-feel notes app. Write anything; it saves as you type.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="list">
  <div class="app">
    <nav class="rail" aria-label="Notes list (collapsed)">
      <button id="expand-list" class="rail-btn rail-expand" type="button" aria-label="Show notes list" title="Show notes list (Ctrl+\)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 9l3 3-3 3"/></svg>
      </button>
      <button id="rail-new" class="rail-btn rail-new" type="button" aria-label="New note" title="New note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="rail-search" class="rail-btn" type="button" aria-label="Search notes" title="Search notes (Ctrl+K)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </nav>

    <aside class="sidebar" aria-label="Notes list">
      <header class="sidebar-head">
        <h1 class="brand">Notes</h1>
        <button id="collapse-list" class="collapse-btn" type="button" aria-label="Hide notes list" title="Hide notes list (Ctrl+\)" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 9l-3 3 3 3"/></svg>
        </button>
        <button id="new-note" class="btn-primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New note
        </button>
      </header>

      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
      </label>

      <div id="tag-filter" class="tag-filter" role="group" aria-label="Filter by tag" hidden></div>

      <div class="list-meta">
        <span id="count"></span>
        <label class="sort">Sort
          <select id="sort">
            <option value="updated">Last edited</option>
            <option value="created">Date created</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>

      <ul id="note-list" class="note-list"></ul>

      <details id="backup" class="backup">
        <summary>Backup</summary>
        <div class="backup-menu">
          <button id="export" type="button">Export notes</button>
          <button id="import" type="button">Import notes…</button>
          <p id="app-version" class="app-version"></p>
        </div>
      </details>
      <input id="import-file" type="file" accept=".json,application/json" hidden>

      <button id="new-note-fab" class="fab" type="button" aria-label="New note">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </aside>

    <main class="editor-wrap">
      <div id="editor" class="editor">
        <div class="editor-bar">
          <button id="back" class="back" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            Notes
          </button>
          <div id="swatches" class="swatches" role="group" aria-label="Note color"></div>
          <div class="format-tools" role="group" aria-label="Lists">
            <button id="list-numbered" class="fmt-btn" type="button" aria-label="Numbered list" title="Numbered list (or type 1. and a space)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M4 4.5l1.5-1V9M3.5 9H6M3.5 14.2c.4-.7 2.6-1 2.6.6 0 1-2.6 2-2.6 3.2H6.2"/></svg>
            </button>
            <button id="list-bullet" class="fmt-btn" type="button" aria-label="Bulleted list" title="Bulleted list (or type - and a space)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
          <span id="meta" class="meta"></span>
          <button id="tag-hint" class="tag-hint" type="button" hidden>
            <span class="tag-hint-label"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <button id="add-image" class="add-image-btn" type="button" title="Add image (or paste one)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
            <span class="add-image-label">Add image</span>
          </button>
          <input id="image-file" type="file" accept="image/*" multiple hidden>
          <button id="pin" class="pin-btn" type="button" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 3 3H7l3-3-1-6zM12 15v6"/></svg>
            <span class="pin-label">Pin</span>
          </button>
          <button id="delete" class="icon-btn" type="button" aria-label="Delete note">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          </button>
        </div>
        <div class="page">
          <input id="title" class="title" type="text" placeholder="Title" aria-label="Title" spellcheck="true" autocapitalize="sentences">
          <textarea id="body" class="body" placeholder="Start writing…" aria-label="Note" spellcheck="true" autocapitalize="sentences"></textarea>
          <ul id="checklist" class="checklist" aria-label="Checklist" hidden></ul>
          <section id="note-images" class="note-images" aria-label="Images in this note" hidden>
            <span id="note-images-count" class="note-images-count"></span>
            <div id="note-images-row" class="note-images-row"></div>
          </section>
          <div id="note-tags" class="note-tags" hidden></div>
        </div>
        <div class="empty">
          <p class="empty-title">No note open</p>
          <p class="empty-hint">Pick a note from the list, or start a new one.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Image, full size" hidden>
    <div class="viewer-bar">
      <button id="viewer-close" class="viewer-btn" type="button" aria-label="Close image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <span id="viewer-count" class="viewer-count"></span>
      <button id="viewer-remove" class="viewer-btn viewer-remove" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        Remove
      </button>
    </div>
    <img id="viewer-img" class="viewer-img" alt="">
    <button id="viewer-prev" class="viewer-btn viewer-step viewer-prev" type="button" aria-label="Previous image">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="viewer-next" class="viewer-btn viewer-step viewer-next" type="button" aria-label="Next image">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div id="menu-scrim" class="menu-scrim" hidden></div>
  <div id="new-menu" class="new-menu" role="menu" aria-label="New note type" hidden>
    <button class="new-menu-item" type="button" role="menuitem" data-kind="text">
      <span class="new-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <span class="new-menu-text"><strong>Text</strong><span class="new-menu-sub">Write freely</span></span>
    </button>
    <button class="new-menu-item" type="button" role="menuitem" data-kind="checklist">
      <span class="new-menu-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg></span>
      <span class="new-menu-text"><strong>Checklist</strong><span class="new-menu-sub">Tick things off</span></span>
    </button>
  </div>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-msg">Note deleted</span>
    <button id="undo" class="toast-action" type="button">Undo</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
